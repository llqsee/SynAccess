      image: https://img.shields.io/github/license/Netcodez/Scalable-Visualization-and-Explainability-of-Synthetic-Datasets.svg
      url: https://github.com/Netcodez/Scalable-Visualization-and-Explainability-of-Synthetic-Datasets/blob/main/LICENSE

