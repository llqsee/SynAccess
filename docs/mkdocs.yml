site_name: MAVIS - Scalable Visualization and Explainability of Synthetic Datasets
site_description: A full-stack web application for visualizing and comparing real and synthetic datasets using advanced dimensionality reduction techniques.
site_author: Netochukwu Onyiaji
site_url: http://127.0.0.1:8000
# Repository
repo_name: Scalable-Visualization-and-Explainability-of-Synthetic-Datasets
repo_url: https://github.com/Netcodez/Scalable-Visualization-and-Explainability-of-Synthetic-Datasets

# Theme configuration
theme:
  name: material
  logo: images/logo.png
  favicon: images/favicon.png
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.delay
    - navigation.instant.loading
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - navigation.path
    - toc.integrate
    - content.action.edit
    - content.action.view
    - content.tooltips
    - announce.dismiss
    - navigation.footer
    - navigation.expand
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.loading
    - navigation.instant.delay
    - navigation.prune
    - search.highlight
    - search.suggest
    - search.share
    - toc.follow
    - toc.integrate
  icon:
    repo: fontawesome/brands/github
  language: en
  font:
    text: Inter
    code: JetBrains Mono

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Netcodez/Scalable-Visualization-and-Explainability-of-Synthetic-Datasets
      name: GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/mavis-synthetic/
      name: PyPI
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/
      name: Docker
  badges:
    - type: pypi
      name: PyPI
      image: https://img.shields.io/pypi/v/mavis-synthetic.svg
      url: https://pypi.org/project/mavis-synthetic/
    - type: github
      name: GitHub Actions
      image: https://github.com/Netcodez/Scalable-Visualization-and-Explainability-of-Synthetic-Datasets/actions/workflows/ci.yml/badge.svg
      url: https://github.com/Netcodez/Scalable-Visualization-and-Explainability-of-Synthetic-Datasets/actions
    - type: license
