version: '3.8'

services:
  mavis-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENV_FILE: ${ENV_FILE:-environment.yml}  # Use environment-gpu.yml for GPU build
    ports:
      - "8000:8000"
      - "3000:3000"
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite:///mavis_dev.db
      - NODE_ENV=${NODE_ENV:-production}
      - STARTUP_COMMAND=${STARTUP_COMMAND:-./start.sh}
      - DOCKERFILE=${DOCKERFILE:-Dockerfile}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./frontend:/app/frontend:delegated
      - ./backend:/app/backend:delegated
    restart: unless-stopped
    command: ${STARTUP_COMMAND:-./start.sh}

  # Add nginx for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - mavis-app
    restart: unless-stopped
    profiles:
      - production

# ---
# To build for CPU (default):
#   docker compose up --build
#
# To build for GPU:
#   ENV_FILE=environment-gpu.yml docker compose up --build
# --- 