name: Docker Live Testing

on:
  workflow_dispatch:
    inputs:
      test_duration:
        description: 'How long to keep app running (minutes)'
        default: '30'
        required: true
        type: string
      run_tests:
        description: 'Run tests before launching'
        default: true
        required: false
        type: boolean
      expose_ports:
        description: 'Expose ports for external access'
        default: true
        required: false
        type: boolean

jobs:
  launch-app:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build application
      run: |
        echo "🏗️ Building MAVIS application..."
        docker compose build
        
    - name: Run tests (optional)
      if: ${{ inputs.run_tests == 'true' }}
      run: |
        echo "🧪 Running tests..."
        docker compose run --rm mavis-app python run_tests.py --ci --coverage --verbose
        
    - name: Launch application
      run: |
        echo "🚀 Launching MAVIS application..."
        docker compose up -d
        
        echo "⏳ Waiting for services to start..."
        sleep 30
        
        echo "📊 Service status:"
        docker compose ps
        
        echo "🔍 Testing API endpoints..."
        curl -f http://localhost:8000/health || echo "Health check failed"
        
        echo "🌐 Application URLs:"
        echo "Backend API: http://localhost:8000"
        echo "Frontend: http://localhost:3000"
        echo "API Docs: http://localhost:8000/docs"
        
        echo "⏰ Keeping application running for ${{ inputs.test_duration }} minutes..."
        echo "You can now test the application manually!"
        
        # Keep the application running for the specified duration
        sleep $(( ${{ inputs.test_duration }} * 60 ))
        
    - name: Stop application
      if: always()
      run: |
        echo "🛑 Stopping application..."
        docker compose down --volumes --remove-orphans
        
    - name: Cleanup
      if: always()
      run: |
        echo "🧹 Cleaning up Docker resources..."
        docker system prune -f 