name: Docker Compose CI/CD

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build and test type'
        default: 'full'
        required: true
        type: choice
        options:
          - full
          - backend-only
          - frontend-only
      push_image:
        description: 'Push to Docker registry'
        default: false
        required: false
        type: boolean

  push:
    branches:
      - init-branch
      - main

  pull_request:
    branches:
      - main

jobs:
  docker-build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mavis
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Build and test with Docker Compose
      run: |
        # Build the application
        echo "🏗️ Building MAVIS application with Docker Compose..."
        IMAGE_NAME=${IMAGE_NAME} docker compose build
        
        # Test the application startup
        echo "🚀 Testing application startup..."
        IMAGE_NAME=${IMAGE_NAME} docker compose up -d
        
        # Wait for backend health to be ready
        echo "⏳ Waiting for backend health endpoint..."
        for i in {1..30}; do
          if curl -fsS http://localhost:8000/api/v1/health >/dev/null; then
            echo "✅ Backend is healthy"; break; fi; echo "⏳ retry $i"; sleep 3; done
        
        # Final health assertion
        echo "🔍 Verifying health endpoint..."
        curl -f http://localhost:8000/api/v1/health || (echo "Backend health check failed" && IMAGE_NAME=${IMAGE_NAME} docker compose logs mavis-app && exit 1)
        
        # Check if services are running
        echo "📊 Checking service health..."
        docker compose ps
        
        # Test API endpoints (additional basic checks)
        echo "🔍 Testing API endpoints..."
        curl -sSf http://localhost:8000/api/v1/docs >/dev/null || echo "OpenAPI docs may be disabled"
        
        # Stop services
        IMAGE_NAME=${IMAGE_NAME} docker compose down
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: docker-test-results
        path: |
          backend/htmlcov/
          frontend/coverage/
          logs/
        
    - name: Build and push Docker image to GHCR (if requested)
      if: ${{ inputs.push_image == 'true' }}
      run: |
        echo "🐳 Building and pushing Docker image to GHCR..."
        IMAGE_NAME=${IMAGE_NAME} docker compose build
        IMAGE_NAME=${IMAGE_NAME} docker compose push
        
    - name: Cleanup
      if: always()
      run: |
        echo "🧹 Cleaning up Docker resources..."
        docker compose down --volumes --remove-orphans
        docker system prune -f 