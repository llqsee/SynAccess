name: Docker Compose CI/CD

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build and test type'
        default: 'full'
        required: true
        type: choice
        options:
          - full
          - backend-only
          - frontend-only
      push_image:
        description: 'Push to Docker registry'
        default: false
        required: false
        type: boolean

  push:
    branches:
      - init-branch

  pull_request:
    branches:
      - main

jobs:
  docker-build-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build and test with Docker Compose
      run: |
        # Build the application
        echo "🏗️ Building MAVIS application with Docker Compose..."
        docker compose build
        
        # Test the application startup
        echo "🚀 Testing application startup..."
        docker compose up -d
        sleep 30
        
        # Check if services are running
        echo "📊 Checking service health..."
        docker compose ps
        
        # Test API endpoints
        echo "🔍 Testing API endpoints..."
        curl -f http://localhost:8000/health || echo "Backend health check failed"
        
        # Stop services
        docker compose down
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: docker-test-results
        path: |
          backend/htmlcov/
          frontend/coverage/
          logs/
        
    - name: Build and push Docker image (if requested)
      if: ${{ inputs.push_image == 'true' }}
      run: |
        echo "🐳 Building and pushing Docker image..."
        # Add your Docker registry login here if needed
        # docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
        
        # Build and push
        docker compose build
        # docker compose push  # Uncomment when registry is configured
        
    - name: Cleanup
      if: always()
      run: |
        echo "🧹 Cleaning up Docker resources..."
        docker compose down --volumes --remove-orphans
        docker system prune -f 