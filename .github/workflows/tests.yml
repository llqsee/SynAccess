name: Frontend and Backend Tests

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        default: 'all'
        required: true
        type: choice
        options:          
          - frontend
          - backend
          - lint
      coverage:
        description: 'Generate coverage reports'
        default: true
        required: false
        type: boolean
      verbose:
        description: 'Verbose output'
        default: true
        required: false
        type: boolean

  push:
    branches:
      - initial-dev

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: '3.10'

    - name: Create Conda environment
      shell: bash -l {0}
      run: |
        conda env create -f environment.yml

    - name: Install Node.js dependencies
      run: |
        cd frontend
        npm ci

    - name: Run tests
      shell: bash -l {0}
      run: |
        conda activate mavis
        python run_tests.py \
          ${{ github.event.inputs.test_type == 'frontend' && '--frontend' || '' }} \
          ${{ github.event.inputs.test_type == 'backend' && '--backend' || '' }} \
          ${{ github.event.inputs.test_type == 'lint' && '--lint' || '' }} \
          ${{ (github.event.inputs.coverage == 'true') && '--coverage' || '' }} \
          ${{ (github.event.inputs.verbose == 'true') && '--verbose' || '' }} \
          --ci

    - name: Upload backend coverage (if generated)
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/htmlcov/coverage.xml
        flags: backend
        name: backend-coverage
      if: ${{ github.event.inputs.coverage == 'true' || github.event_name != 'workflow_dispatch' }}

    - name: Upload frontend coverage (if generated)
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
      if: ${{ github.event.inputs.coverage == 'true' || github.event_name != 'workflow_dispatch' }}
