name: mavis-gpu
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - numpy=1.24.4
  - pandas=2.0.3
  - scipy=1.11.4
  - scikit-learn
  - matplotlib
  - seaborn
  - plotly
  - fastapi
  - uvicorn
  - python-multipart
  - requests
  - httpx
  - aiofiles
  - jinja2
  - python-jose
  - cryptography
  - passlib
  - bcrypt
  - sqlalchemy
  - alembic
  - pydantic
  - pydantic-settings
  - pytest>=7.4.0
  - pytest-cov>=4.0.0
  - python-dotenv
  - opentsne
  - umap-learn
  - pyzmq
  - lz4
  - psutil
  - zstandard
  - statsmodels
