name: mavis
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - typer
  - loguru
  - tqdm
  - ipython
  - jupyterlab
  - matplotlib
  - seaborn  
  - notebook
  # Core data science libraries
  - numpy
  - pandas
  - scikit-learn
  - scipy  # Required for statistical tests in distribution analysis
  # Dimensionality reduction
  - umap-learn
  - openTSNE
  # Code quality
  - black
  - flake8
  - isort
  # Web framework
  - fastapi
  - uvicorn
  # Additional statistical packages for distribution analysis
  - statsmodels
  - pip:
    - python-dotenv
    - plotly
    - jupyter-black
    - pydantic  # For FastAPI request/response models
    #- tsnecuda
    - vizdataquality
    - awscli
    - mkdocs 