name: mavis
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip

  # Core scientific stack (3.12-compatible)
  - numpy>=1.26    # NumPy 1.26+ supports Py3.12
  - pandas>=2.1
  - scipy>=1.11
  - scikit-learn>=1.3

  # Viz
  - matplotlib>=3.7
  - seaborn>=0.12
  - plotly>=5.15

  # Web/API
  - fastapi>=0.100
  - uvicorn>=0.23
  - python-multipart>=0.0.6
  - requests>=2.31
  - httpx>=0.24
  - aiofiles>=23.1
  - jinja2>=3.1

  # Auth/crypto (no pip-style extras here)
  - python-jose
  - cryptography
  - passlib
  - bcrypt

  # DB & settings
  - sqlalchemy>=2.0
  - alembic>=1.11
  - pydantic>=2.0
  - pydantic-settings>=2.0
  - python-dotenv>=1.0.0

  # Dim. reduction (note the package name on conda is lowercase)
  - opentsne>=1.0
  - umap-learn>=0.5

  # Utils
  - pyzmq>=25.0.0
  - lz4>=4.0.0
  - psutil>=5.9.0
  - zstandard>=0.21.0
  - statsmodels>=0.14.0

  # Synthetic data eval (Conda)
  - sdv>=1.0.0
  - sdmetrics>=0.10.0
  - anthropic          # available on conda-forge

  # Testing
  - pytest>=7.4.0
  - pytest-cov>=4.0.0
  - pytest-asyncio>=0.21.0

  # Code quality
  - black>=23.0.0
  - flake8>=6.0.0
  - isort>=5.12.0

  - pip:
      - synthcity>=0.2.12
     